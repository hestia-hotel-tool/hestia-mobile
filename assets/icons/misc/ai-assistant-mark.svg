<svg viewBox="0 0 44 45" fill="none" xmlns="http://www.w3.org/2000/svg">
<!--
  The assistant's mark as it appears on the AI panel — Figma node 3910:1469.

  The light-surface twin of `nav-ai`: same house-and-"AI" drawing, different
  fades. Here the house and the ring run #FF46A3 -> white so they dissolve into
  the white card; in the tab bar they run to #5A759D over the bar's own ground.
  Same glyph, so it is not worth redrawing — but not the same asset either,
  which is why both are registered.

  Stripped of the export's artefacts, as with nav-ai: a 44x45 #1E1E1E backdrop
  and a 440x1231 white page rect with the clip path pinning them.

  Two-tone by design, so NOT tintable — it must never be handed a `color`.
-->
