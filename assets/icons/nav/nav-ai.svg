<svg viewBox="0 0 82 82" fill="none" xmlns="http://www.w3.org/2000/svg">
<!--
  The AI assistant button — Figma node 3859:1498 (and its twins 3843:152,
  3883:6324, which are the same component).

  Exported from Figma, then stripped of three artefacts the export carries:
  an 82x82 #1E1E1E canvas backdrop, a 440x2897 white rect for the whole page,
  and the clip path pinning it. Left in, they paint a dark square behind the
  mark and a page-sized white field around it — the same defect
  guest-turndown.svg shipped with.

  Two-tone by design: a #FF46A3 -> #5A759D gradient on the mark (the ink-pink
  and primary tokens) over a #5A759D -> white ring. It is therefore NOT
  registered tintable, and must not be handed a `color` — flattening it to one
  colour is exactly what the PNG this replaces was doing.
-->
<g>
  <!-- The "h" crossbar. -->
  <path d="M48.6411 41.9036V51.8757H43.9874V46.8896H33.1289V41.9036H48.6411Z" fill="url(#navAiMark)"/>
  <!-- The house outline and the "h" stem. -->
  <path d="M59.721 31.8319V58.382H26.2474L33.0075 32.6118L37.6681 33.8748L32.5251 53.4802H54.8979V34.6546L39.2228 25.4106L23.5477 34.6546V58.524H18.7246V31.8319L39.2228 19.7437L59.721 31.8319Z" fill="url(#navAiHouse)"/>
  <!-- "AI", set as outlines in the design rather than live text. -->
  <path d="M60.6758 17.6863H61.9987V24.0588H60.6758V17.6863Z" fill="url(#navAiI)"/>
  <path d="M58.1123 22.7489H55.7647L55.3237 24.0588H53.9316L56.2057 17.6863H57.7102L59.967 24.0588H58.523L58.1123 22.7489ZM57.7405 21.6508L56.945 19.1432L56.1236 21.6508H57.7405Z" fill="url(#navAiA)"/>
  <circle cx="41" cy="41" r="40.5" stroke="url(#navAiRing)"/>
</g>
<defs>
<linearGradient id="navAiMark" x1="40.885" y1="41.9036" x2="40.5564" y2="53.9345" gradientUnits="userSpaceOnUse">
<stop stop-color="#FF46A3"/>
<stop offset="1" stop-color="#5A759D"/>
</linearGradient>
<linearGradient id="navAiHouse" x1="39.2228" y1="19.7437" x2="37.3439" y2="66.4901" gradientUnits="userSpaceOnUse">
<stop stop-color="#FF46A3"/>
<stop offset="1" stop-color="#5A759D"/>
</linearGradient>
<linearGradient id="navAiI" x1="61.3372" y1="17.6863" x2="59.8258" y2="25.0709" gradientUnits="userSpaceOnUse">
<stop stop-color="#FF46A3"/>
<stop offset="1" stop-color="#5A759D"/>
</linearGradient>
<linearGradient id="navAiA" x1="56.9493" y1="17.6863" x2="56.6048" y2="25.3648" gradientUnits="userSpaceOnUse">
<stop stop-color="#FF46A3"/>
<stop offset="1" stop-color="#5A759D"/>
</linearGradient>
<linearGradient id="navAiRing" x1="41" y1="0" x2="41" y2="82" gradientUnits="userSpaceOnUse">
<stop stop-color="#5A759D"/>
<stop offset="1" stop-color="white"/>
</linearGradient>
</defs>
</svg>
